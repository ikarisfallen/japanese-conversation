<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>話そう Sentence Builder</title>
  <meta name="description" content="Casual Tokyo Japanese listening practice: hear a sentence, rebuild it word by word.">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="soundalike.js" defer></script>
  <script src="sentences.js" defer></script>
  <script src="furigana.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="app">

    <!-- Home -->
    <section id="view-home" class="view">
      <header class="brand">
        <h1><span class="jp">話そう</span> <span class="sub">Sentence Builder</span></h1>
        <p class="tag">Casual Tokyo Japanese · タメ口</p>
      </header>

      <div class="stats">
        <div class="stat"><b id="stat-played">0</b><span>sentences</span></div>
        <div class="stat"><b id="stat-perfect">0</b><span>perfect</span></div>
        <div class="stat"><b id="stat-accuracy">–</b><span>accuracy</span></div>
      </div>

      <h2 class="label">Topics</h2>
      <div id="cats" class="chips"></div>

      <button id="btn-start" class="primary big">Start</button>

      <p id="env-warning" class="warning" hidden></p>

      <details class="settings">
        <summary>Settings</summary>
        <label class="row">
          <span>Sentences per round</span>
          <input type="number" id="set-count" min="1" max="50">
        </label>
        <label class="row">
          <span>Wrong choices</span>
          <select id="set-choices">
            <option value="similar">Sound-alike (hard)</option>
            <option value="different">Different words (easy)</option>
          </select>
        </label>
        <label class="row">
          <span>Speech speed <output id="rate-out"></output></span>
          <input type="range" id="set-rate" min="0.6" max="1.2" step="0.05">
        </label>
        <label class="row">
          <span>Voice</span>
          <select id="set-voice"></select>
        </label>
        <button id="btn-reset" class="danger small-btn">Reset stats</button>
      </details>
    </section>

    <!-- Round -->
    <section id="view-drill" class="view" hidden>
      <div class="topbar">
        <button id="btn-quit" class="icon-btn" aria-label="End round">✕</button>
        <div class="progress"><div id="progress-bar"></div></div>
        <span id="progress-text" class="muted small"></span>
      </div>

      <article class="card">
        <p id="card-cat" class="cat"></p>
        <div class="question">
          <button id="btn-say" class="icon-btn speak" aria-label="Play the sentence again">🔊</button>
          <div id="transcript" class="jp transcript"></div>
        </div>
        <p id="meaning-en" class="reveal-box" hidden></p>
        <div class="toggles">
          <button id="btn-kana" class="toggle" aria-pressed="false">Kana</button>
          <button id="btn-meaning" class="toggle" aria-pressed="false">Meaning</button>
        </div>
      </article>

      <div class="builder">
        <p class="label">Build what you heard</p>
        <div id="built" class="built jp"></div>
        <div id="choices" class="choices jp"></div>
      </div>

      <div id="result" class="result" hidden>
        <p id="verdict" class="verdict"></p>
        <p id="result-en" class="result-en"></p>
        <button id="btn-next" class="primary big">Next</button>
      </div>
    </section>

    <!-- Summary -->
    <section id="view-done" class="view" hidden>
      <h2 class="jp done-title">お疲れ！</h2>
      <p id="done-text"></p>
      <ul id="done-list" class="done-list"></ul>
      <button id="btn-home" class="primary big">Back to home</button>
    </section>

  </main>
</body>
</html>
